<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>老爹涼糕點單表</title>
</head>
<body>
  <div class="dad-shop-form">
    <div class="panel">
      <div class="hero">
        <div class="hero-icon">🍡</div>
        <h2>老爹涼糕點單表</h2>
      </div>

      <div class="menu" id="menuList"></div>

      <div class="summary-box">
        <div class="summary-title">訂單總表摘要</div>
        <div class="summary-row">
          <span>總數量</span>
          <strong><span id="totalQty">0</span> 份</strong>
        </div>
        <div class="summary-row total">
          <span>總金額</span>
          <strong>$<span id="totalPrice">0</span> 元</strong>
        </div>
      </div>

      <div class="info-box">
        <div class="section-header">個人資料與其他備註</div>

        <div class="field">
          <label>收件姓名</label>
          <input id="name" type="text" placeholder="請輸入姓名" />
        </div>

        <div class="field">
          <label>電話</label>
          <input id="phone" type="tel" placeholder="請輸入電話" />
        </div>

        <div class="field">
          <label>到府服務地址</label>
          <textarea id="address" rows="3" placeholder="請輸入地址"></textarea>
        </div>

        <div class="field">
          <label>7-11（寄冰）</label>
          <input id="store711" type="text" placeholder="請輸入門市 / 店名" />
        </div>

        <div class="field">
          <label>全家（寄冰）</label>
          <input id="storeFamily" type="text" placeholder="請輸入門市 / 店名" />
        </div>

        <div class="field">
          <label>沒有加購的資料 / 其他備註</label>
          <textarea id="note" rows="3" placeholder="請輸入其他備註"></textarea>
        </div>
      </div>

      <button id="copyBtn" type="button" class="copy-btn">一鍵複製</button>
      <div id="copyStatus" class="copy-status"></div>

      <a href="https://line.me/" target="_blank" rel="noopener" class="line-btn">👉 點擊前往官方 LINE 貼上訂單</a>
    </div>
  </div>

  <style>
    .dad-shop-form {
      --bg: #fffaf5;
      --panel: #ffffff;
      --soft: #fff3e8;
      --card: #fff9f4;
      --accent: #f39a5c;
      --accent-dark: #e66b43;
      --text: #3d2b25;
      --sub: #6a4a40;
      --line: #f3d6c0;
      --success: #2e9d4a;
      --shadow: 0 18px 42px rgba(122, 63, 42, 0.08);
      font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
      background: linear-gradient(180deg, #fffaf5 0%, #fff1e3 100%);
      padding: 20px 12px;
      box-sizing: border-box;
    }

    .dad-shop-form * {
      box-sizing: border-box;
    }

    .dad-shop-form .panel {
      max-width: 720px;
      margin: 0 auto;
      background: var(--panel);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(243, 154, 92, 0.18);
    }

    .dad-shop-form .hero {
      background: linear-gradient(135deg, #ff9d6c 0%, #e76b42 100%);
      color: #fff;
      text-align: center;
      padding: 28px 20px 22px;
    }

    .dad-shop-form .hero-icon {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .dad-shop-form .hero h2 {
      margin: 0;
      font-size: clamp(24px, 4vw, 30px);
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .dad-shop-form .menu {
      padding: 24px 18px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dad-shop-form .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dad-shop-form .menu-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.04);
    }

    .dad-shop-form .item-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--sub);
      font-size: 15px;
      flex-wrap: wrap;
    }

    .dad-shop-form .price-tag {
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .dad-shop-form .qty-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .dad-shop-form .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      font-size: 26px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .dad-shop-form .qty-btn:hover {
      background: var(--accent-dark);
    }

    .dad-shop-form .qty-btn:active {
      transform: scale(0.96);
    }

    .dad-shop-form .qty-input {
      width: 42px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      padding: 0;
    }

    .dad-shop-form .summary-box {
      background: var(--soft);
      border: 2px solid #f5d9ba;
      border-radius: 18px;
      margin: 24px 18px 0;
      padding: 18px 16px;
    }

    .dad-shop-form .summary-title {
      font-size: 16px;
      font-weight: 800;
      color: #7a3f2a;
      margin-bottom: 12px;
    }

    .dad-shop-form .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-size: 15px;
      margin-bottom: 8px;
    }

    .dad-shop-form .summary-row strong {
      color: var(--accent-dark);
      font-size: 16px;
    }

    .dad-shop-form .summary-row.total {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #e7c8a4;
      font-size: 18px;
      font-weight: 800;
    }

    .dad-shop-form .summary-row.total strong {
      font-size: 20px;
    }

    .dad-shop-form .info-box {
      padding: 22px 18px 0;
    }

    .dad-shop-form .section-header {
      color: #7a3f2a;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .dad-shop-form .field {
      margin-bottom: 14px;
    }

    .dad-shop-form .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--sub);
      font-size: 14px;
      font-weight: 700;
    }

    .dad-shop-form .field input,
    .dad-shop-form .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .dad-shop-form .field input:focus,
    .dad-shop-form .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(243, 154, 92, 0.12);
    }

    .dad-shop-form .field textarea {
      min-height: 84px;
      resize: vertical;
    }

    .dad-shop-form .copy-btn {
      margin: 18px 18px 8px;
      width: calc(100% - 36px);
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff9d6c 0%, #e76b42 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      padding: 15px 18px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(231, 107, 66, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dad-shop-form .copy-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 22px rgba(231, 107, 66, 0.24);
    }

    .dad-shop-form .copy-btn:active {
      transform: translateY(0);
    }

    .dad-shop-form .copy-status {
      min-height: 20px;
      text-align: center;
      color: var(--success);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .dad-shop-form .line-btn {
      display: block;
      margin: 0 18px 22px;
      text-align: center;
      text-decoration: none;
      color: #1686d9;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid rgba(22, 134, 217, 0.4);
      background: #f7fbff;
      padding: 12px 14px;
      border-radius: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .dad-shop-form .line-btn:hover {
      background: #edf6ff;
      color: #0b65b9;
    }

    @media (max-width: 560px) {
      .dad-shop-form .menu-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .dad-shop-form .qty-box {
        width: 100%;
        justify-content: flex-end;
      }

      .dad-shop-form .summary-row,
      .dad-shop-form .summary-row.total {
        font-size: 14px;
      }

      .dad-shop-form .summary-row.total strong {
        font-size: 18px;
      }
    }
  </style>

  <script>
    (function () {
      const menuData = [
        { name: '多多玫瑰', price: 100 },
        { name: '水果綜合', price: 100 },
        { name: '布丁', price: 100 },
        { name: '純杏仁', price: 100 },
        { name: '泰奶口味', price: 100 },
        { name: '巧克力', price: 100 },
        { name: '玫瑰芋心', price: 150 },
        { name: '布丁芋心', price: 150 }
      ];

      const quantities = new Array(menuData.length).fill(0);
      const menuList = document.getElementById('menuList');

      function renderMenu() {
        menuList.innerHTML = '';

        menuData.forEach((item, index) => {
          const itemEl = document.createElement('div');
          itemEl.className = 'menu-item';

          itemEl.innerHTML = `
            <div class="item-name">
              <span>${item.name}</span>
              <span class="price-tag">(${item.price}元)</span>
            </div>
            <div class="qty-box">
              <button type="button" class="qty-btn minus" aria-label="減少數量">−</button>
              <input class="qty-input" type="text" value="0" readonly />
              <button type="button" class="qty-btn plus" aria-label="增加數量">+</button>
            </div>
          `;

          const minusBtn = itemEl.querySelector('.minus');
          const plusBtn = itemEl.querySelector('.plus');
          const qtyInput = itemEl.querySelector('.qty-input');

          minusBtn.addEventListener('click', () => {
            if (quantities[index] > 0) {
              quantities[index] -= 1;
              updateUI();
            }
          });

          plusBtn.addEventListener('click', () => {
            quantities[index] += 1;
            updateUI();
          });

          qtyInput.value = quantities[index];
          menuList.appendChild(itemEl);
        });
      }

      function updateUI() {
        const allInputs = document.querySelectorAll('.qty-input');
        let totalQty = 0;
        let totalPrice = 0;

        menuData.forEach((item, index) => {
          const qty = quantities[index];
          totalQty += qty;
          totalPrice += qty * item.price;
          allInputs[index].value = qty;
        });

        document.getElementById('totalQty').textContent = totalQty;
        document.getElementById('totalPrice').textContent = totalPrice;
      }

      function buildOrderText() {
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const address = document.getElementById('address').value.trim();
        const store711 = document.getElementById('store711').value.trim();
        const storeFamily = document.getElementById('storeFamily').value.trim();
        const note = document.getElementById('note').value.trim();

        let lines = ['🍡 老爹涼糕點單表', ''];

        menuData.forEach((item, index) => {
          const qty = quantities[index];
          if (qty > 0) {
            lines.push(`${item.name} (${item.price}元) × ${qty}`);
          }
        });

        const totalQty = quantities.reduce((sum, n) => sum + n, 0);
        const totalPrice = menuData.reduce((sum, item, index) => sum + quantities[index] * item.price, 0);

        lines.push('');
        lines.push('📋 訂單總表摘要');
        lines.push(`總數量：${totalQty} 份`);
        lines.push(`總金額：$${totalPrice} 元`);
        lines.push('');
        lines.push('📦 個人資料與其他備註');
        lines.push(`收件姓名：${name || '未填寫'}`);
        lines.push(`電話：${phone || '未填寫'}`);
        lines.push(`到府服務地址：${address || '未填寫'}`);
        lines.push(`7-11（寄冰）：${store711 || '未填寫'}`);
        lines.push(`全家（寄冰）：${storeFamily || '未填寫'}`);
        lines.push(`沒有加購的資料 / 其他備註：${note || '未填寫'}`);

        return lines.join('\n');
      }

      document.getElementById('copyBtn').addEventListener('click', async function () {
        const text = buildOrderText();
        const statusEl = document.getElementById('copyStatus');

        try {
          await navigator.clipboard.writeText(text);
          statusEl.textContent = '✅ 已複製訂單內容';
        } catch (err) {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          statusEl.textContent = '✅ 已複製訂單內容';
        }

        setTimeout(() => {
          statusEl.textContent = '';
        }, 2500);
      });

      renderMenu();
      updateUI();
    })();
  </script>
</body>
</html>
