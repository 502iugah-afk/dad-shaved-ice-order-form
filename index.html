<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>老爹涼糕點單表</title>
</head>
<body>
  <div class="dad-order-lite">
    <div class="panel">
      <div class="title">🍡 老爹涼糕點單表</div>

      <div class="menu">
        <div class="menu-item">
          <div class="item-name">
            <span>多多玫瑰</span>
            <span class="price-tag">(100元)</span>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn minus">−</button>
            <input class="qty-input" type="text" value="0" readonly data-price="100" />
            <button type="button" class="qty-btn plus">+</button>
          </div>
        </div>

        <div class="menu-item">
          <div class="item-name">
            <span>水果綜合</span>
            <span class="price-tag">(100元)</span>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn minus">−</button>
            <input class="qty-input" type="text" value="0" readonly data-price="100" />
            <button type="button" class="qty-btn plus">+</button>
          </div>
        </div>

        <div class="menu-item">
          <div class="item-name">
            <span>布丁</span>
            <span class="price-tag">(100元)</span>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn minus">−</button>
            <input class="qty-input" type="text" value="0" readonly data-price="100" />
            <button type="button" class="qty-btn plus">+</button>
          </div>
        </div>

        <div class="menu-item">
          <div class="item-name">
            <span>純杏仁</span>
            <span class="price-tag">(100元)</span>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn minus">−</button>
            <input class="qty-input" type="text" value="0" readonly data-price="100" />
            <button type="button" class="qty-btn plus">+</button>
          </div>
        </div>

        <div class="menu-item">
          <div class="item-name">
            <span>泰奶口味</span>
            <span class="price-tag">(100元)</span>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn minus">−</button>
            <input class="qty-input" type="text" value="0" readonly data-price="100" />
            <button type="button" class="qty-btn plus">+</button>
          </div>
        </div>

        <div class="menu-item">
          <div class="item-name">
            <span>巧克力</span>
            <span class="price-tag">(100元)</span>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn minus">−</button>
            <input class="qty-input" type="text" value="0" readonly data-price="100" />
            <button type="button" class="qty-btn plus">+</button>
          </div>
        </div>

        <div class="menu-item">
          <div class="item-name">
            <span>玫瑰芋心</span>
            <span class="price-tag">(150元)</span>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn minus">−</button>
            <input class="qty-input" type="text" value="0" readonly data-price="150" />
            <button type="button" class="qty-btn plus">+</button>
          </div>
        </div>

        <div class="menu-item">
          <div class="item-name">
            <span>布丁芋心</span>
            <span class="price-tag">(150元)</span>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn minus">−</button>
            <input class="qty-input" type="text" value="0" readonly data-price="150" />
            <button type="button" class="qty-btn plus">+</button>
          </div>
        </div>
      </div>

      <div class="summary">
        <div class="summary-head">訂單總表摘要</div>
        <div class="sum-row">
          <span>總數量</span>
          <strong><span id="totalQty">0</span> 份</strong>
        </div>
        <div class="sum-row total">
          <span>總金額</span>
          <strong>$<span id="totalPrice">0</span> 元</strong>
        </div>
      </div>

      <div class="form">
        <div class="label">收件姓名</div>
        <input id="name" type="text" placeholder="請輸入姓名" />

        <div class="label">電話</div>
        <input id="phone" type="tel" placeholder="請輸入電話" />

        <div class="label">到府服務地址</div>
        <textarea id="address" rows="3" placeholder="請輸入地址"></textarea>

        <div class="label">7-11（寄冰）</div>
        <input id="store711" type="text" placeholder="請輸入門市 / 店名" />

        <div class="label">全家（寄冰）</div>
        <input id="storeFamily" type="text" placeholder="請輸入門市 / 店名" />

        <div class="label">沒有加購的資料 / 其他備註</div>
        <textarea id="note" rows="3" placeholder="請輸入其他備註"></textarea>
      </div>

      <button id="copyBtn" class="copy-btn" type="button">一鍵複製</button>
      <div id="copyStatus" class="copy-status"></div>

      <a href="https://line.me/" target="_blank" rel="noopener" class="line-link">👉 點擊前往官方 LINE 貼上訂單</a>
    </div>
  </div>

  <style>
    .dad-order-lite {
      --bg: #faf7f3;
      --panel: #ffffff;
      --soft: #fff8f3;
      --line: #eee0d5;
      --text: #3a2b2a;
      --muted: #5f4b46;
      --accent: #d97a4a;
      --accent-dark: #bf6036;
      --success: #2d9d50;
      font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
      background: var(--bg);
      padding: 18px 12px;
    }

    .dad-order-lite * {
      box-sizing: border-box;
    }

    .dad-order-lite .panel {
      max-width: 720px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid #f0e3d8;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.04);
      overflow: hidden;
    }

    .dad-order-lite .title {
      background: #f4f1ed;
      color: var(--text);
      font-size: clamp(24px, 3vw, 28px);
      font-weight: 800;
      text-align: center;
      padding: 22px 16px 18px;
      border-bottom: 1px solid var(--line);
      letter-spacing: 0.04em;
    }

    .dad-order-lite .menu {
      padding: 18px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dad-order-lite .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fffdfb;
      padding: 12px 12px;
    }

    .dad-order-lite .item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .dad-order-lite .price-tag {
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .dad-order-lite .qty-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dad-order-lite .qty-btn {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 8px;
      background: #2d2d2d;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .dad-order-lite .qty-btn:hover {
      background: #474747;
    }

    .dad-order-lite .qty-input {
      width: 42px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
      background: #fff;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      padding: 0;
    }

    .dad-order-lite .summary {
      margin: 20px 16px 0;
      padding: 16px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .dad-order-lite .summary-head {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
    }

    .dad-order-lite .sum-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .dad-order-lite .sum-row strong {
      color: var(--accent-dark);
      font-size: 16px;
    }

    .dad-order-lite .sum-row.total {
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      margin-top: 10px;
      font-weight: 800;
      color: var(--text);
    }

    .dad-order-lite .sum-row.total strong {
      font-size: 20px;
    }

    .dad-order-lite .form {
      padding: 18px 16px 0;
    }

    .dad-order-lite .label {
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    .dad-order-lite .form input,
    .dad-order-lite .form textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 11px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }

    .dad-order-lite .form input:focus,
    .dad-order-lite .form textarea:focus {
      border-color: #8d8d8d;
    }

    .dad-order-lite .form textarea {
      min-height: 84px;
      resize: vertical;
    }

    .dad-order-lite .copy-btn {
      width: calc(100% - 32px);
      margin: 20px 16px 8px;
      border: none;
      border-radius: 12px;
      background: #2b2b2b;
      color: #fff;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .dad-order-lite .copy-status {
      min-height: 20px;
      text-align: center;
      color: var(--success);
      font-size: 14px;
      font-weight: 700;
    }

    .dad-order-lite .line-link {
      display: block;
      text-align: center;
      margin: 6px 16px 18px;
      padding: 12px 10px;
      border-radius: 10px;
      border: 1px solid #dfeaf7;
      background: #f6fbff;
      color: #1a7fd6;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 560px) {
      .dad-order-lite .menu-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .dad-order-lite .qty-box {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>

  <script>
    (function () {
      const inputs = document.querySelectorAll('.qty-input');
      const minusButtons = document.querySelectorAll('.qty-btn.minus');
      const plusButtons = document.querySelectorAll('.qty-btn.plus');

      function updateSummary() {
        let totalQty = 0;
        let totalPrice = 0;

        inputs.forEach(input => {
          const qty = parseInt(input.value) || 0;
          const price = parseInt(input.getAttribute('data-price')) || 0;
          totalQty += qty;
          totalPrice += qty * price;
        });

        document.getElementById('totalQty').textContent = totalQty;
        document.getElementById('totalPrice').textContent = totalPrice;
      }

      minusButtons.forEach((btn, idx) => {
        btn.addEventListener('click', () => {
          const input = inputs[idx];
          const current = parseInt(input.value) || 0;
          if (current > 0) {
            input.value = current - 1;
            updateSummary();
          }
        });
      });

      plusButtons.forEach((btn, idx) => {
        btn.addEventListener('click', () => {
          const input = inputs[idx];
          const current = parseInt(input.value) || 0;
          input.value = current + 1;
          updateSummary();
        });
      });

      document.getElementById('copyBtn').addEventListener('click', async function () {
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const address = document.getElementById('address').value.trim();
        const store711 = document.getElementById('store711').value.trim();
        const storeFamily = document.getElementById('storeFamily').value.trim();
        const note = document.getElementById('note').value.trim();

        let text = '🍡 老爹涼糕點單表\n\n';
        
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach((item, idx) => {
          const name = item.querySelector('.item-name span').textContent;
          const price = item.querySelector('input').getAttribute('data-price');
          const qty = item.querySelector('input').value;
          if (qty > 0) {
            text += `${name} (${price}元) × ${qty}\n`;
          }
        });

        text += `\n📋 訂單總表摘要\n`;
        text += `總數量：${document.getElementById('totalQty').textContent} 份\n`;
        text += `總金額：$${document.getElementById('totalPrice').textContent} 元\n\n`;
        text += `📦 個人資料與其他備註\n`;
        text += `收件姓名：${name || '未填寫'}\n`;
        text += `電話：${phone || '未填寫'}\n`;
        text += `到府服務地址：${address || '未填寫'}\n`;
        text += `7-11（寄冰）：${store711 || '未填寫'}\n`;
        text += `全家（寄冰）：${storeFamily || '未填寫'}\n`;
        text += `沒有加購的資料 / 其他備註：${note || '未填寫'}`;

        const statusEl = document.getElementById('copyStatus');

        try {
          await navigator.clipboard.writeText(text);
          statusEl.textContent = '✅ 已複製訂單內容';
        } catch (err) {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          statusEl.textContent = '✅ 已複製訂單內容';
        }

        setTimeout(() => {
          statusEl.textContent = '';
        }, 2200);
      });

      updateSummary();
    })();
  </script>
</body>
</html>
