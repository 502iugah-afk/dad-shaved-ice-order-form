<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老爹涼糕點單表</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
      font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    }

    .order-app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.05);
    }

    .order-header {
      padding: 28px 20px 22px;
      text-align: center;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }

    .order-header h1 {
      margin: 0;
      color: #222;
      font-size: clamp(24px, 4vw, 28px);
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .order-content {
      padding: 20px 16px 24px;
    }

    .category {
      margin-bottom: 24px;
    }

    .category-title {
      margin-bottom: 12px;
      padding-bottom: 8px;
      color: #222;
      border-bottom: 2px solid #eee;
      font-size: 16px;
      font-weight: 800;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 12px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
    }

    .product-name {
      min-width: 0;
      color: #333;
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .quantity-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      color: #fff;
      background: #222;
      border: 0;
      border-radius: 8px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .quantity-button:hover {
      background: #444;
    }

    .quantity-input {
      width: 44px;
      height: 36px;
      padding: 0;
      color: #222;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
    }

    .summary {
      margin-top: 24px;
      padding: 18px 16px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 12px;
    }

    .summary-title,
    .section-title {
      margin-bottom: 12px;
      color: #222;
      font-size: 16px;
      font-weight: 800;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #555;
      font-size: 15px;
    }

    .summary-row strong {
      color: #222;
      font-size: 17px;
    }

    .summary-row.total {
      margin-top: 12px;
      margin-bottom: 0;
      padding-top: 12px;
      color: #222;
      border-top: 1px solid #e5e5e5;
      font-size: 18px;
      font-weight: 800;
    }

    .summary-row.total strong {
      font-size: 21px;
    }

    .customer-info {
      margin-top: 24px;
    }

    .form-field {
      margin-bottom: 14px;
    }

    .form-field label {
      display: block;
      margin-bottom: 6px;
      color: #444;
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      color: #d32f2f;
    }

    .form-field input,
    .form-field textarea {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 12px;
      color: #222;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-family: inherit;
      font-size: 15px;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-color: #888;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    .form-field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .button-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 22px;
    }

    .action-button {
      width: 100%;
      padding: 15px 16px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .copy-button {
      background: #222;
    }

    .copy-button:hover {
      background: #444;
    }

    .line-button {
      background: #00a900;
    }

    .line-button:hover {
      background: #008b00;
    }

    .status-message {
      min-height: 22px;
      margin-top: 10px;
      color: #218838;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .status-message.error {
      color: #d32f2f;
    }

    .hint {
      margin-top: 12px;
      color: #777;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 420px) {
      body {
        padding: 10px;
      }

      .order-content {
        padding: 16px 12px 20px;
      }

      .product-row {
        gap: 8px;
        padding: 10px;
      }

      .quantity-box {
        gap: 5px;
      }

      .quantity-button {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <main class="order-app">
    <header class="order-header">
      <h1>🍡 老爹涼糕點單表</h1>
    </header>

    <div class="order-content">
      <section class="category" aria-labelledby="category-double">
        <h2 class="category-title" id="category-double">新品雙層口味｜100 元</h2>
        <div class="product-list">
          <div class="product-row">
            <span class="product-name">多多玫瑰</span>
            <div class="quantity-box">
              <button type="button" class="quantity-button minus-button" aria-label="減少多多玫瑰數量">−</button>
              <input type="text" class="quantity-input" value="0" readonly aria-label="多多玫瑰數量" data-name="多多玫瑰" data-price="100">
              <button type="button" class="quantity-button plus-button" aria-label="增加多多玫瑰數量">+</button>
            </div>
          </div>
        </div>
      </section>

      <section class="category" aria-labelledby="category-fruit">
        <h2 class="category-title" id="category-fruit">水果綜合｜100 元</h2>
        <div class="product-list">
          <div class="product-row">
            <span class="product-name">水果口味</span>
            <div class="quantity-box">
              <button type="button" class="quantity-button minus-button" aria-label="減少水果口味數量">−</button>
              <input type="text" class="quantity-input" value="0" readonly aria-label="水果口味數量" data-name="水果口味" data-price="100">
              <button type="button" class="quantity-button plus-button" aria-label="增加水果口味數量">+</button>
            </div>
          </div>
        </div>
      </section>

      <section class="category" aria-labelledby="category-single">
        <h2 class="category-title" id="category-single">單一口味｜100 元</h2>
        <div class="product-list">
          <div class="product-row">
            <span class="product-name">布丁</span>
            <div class="quantity-box">
              <button type="button" class="quantity-button minus-button" aria-label="減少布丁數量">−</button>
              <input type="text" class="quantity-input" value="0" readonly aria-label="布丁數量" data-name="布丁" data-price="100">
              <button type="button" class="quantity-button plus-button" aria-label="增加布丁數量">+</button>
            </div>
          </div>
          <div class="product-row">
            <span class="product-name">純杏仁</span>
            <div class="quantity-box">
              <button type="button" class="quantity-button minus-button" aria-label="減少純杏仁數量">−</button>
              <input type="text" class="quantity-input" value="0" readonly aria-label="純杏仁數量" data-name="純杏仁" data-price="100">
              <button type="button" class="quantity-button plus-button" aria-label="增加純杏仁數量">+</button>
            </div>
          </div>
          <div class="product-row">
            <span class="product-name">泰奶口味</span>
            <div class="quantity-box">
              <button type="button" class="quantity-button minus-button" aria-label="減少泰奶口味數量">−</button>
              <input type="text" class="quantity-input" value="0" readonly aria-label="泰奶口味數量" data-name="泰奶口味" data-price="100">
              <button type="button" class="quantity-button plus-button" aria-label="增加泰奶口味數量">+</button>
            </div>
          </div>
          <div class="product-row">
            <span class="product-name">巧克力</span>
            <div class="quantity-box">
              <button type="button" class="quantity-button minus-button" aria-label="減少巧克力數量">−</button>
              <input type="text" class="quantity-input" value="0" readonly aria-label="巧克力數量" data-name="巧克力" data-price="100">
              <button type="button" class="quantity-button plus-button" aria-label="增加巧克力數量">+</button>
            </div>
          </div>
        </div>
      </section>

      <section class="category" aria-labelledby="category-filled">
        <h2 class="category-title" id="category-filled">新品夾心｜150 元</h2>
        <div class="product-list">
          <div class="product-row">
            <span class="product-name">(1) 玫瑰芋心</span>
            <div class="quantity-box">
              <button type="button" class="quantity-button minus-button" aria-label="減少玫瑰芋心數量">−</button>
              <input type="text" class="quantity-input" value="0" readonly aria-label="玫瑰芋心數量" data-name="(1) 玫瑰芋心" data-price="150">
              <button type="button" class="quantity-button plus-button" aria-label="增加玫瑰芋心數量">+</button>
            </div>
          </div>
          <div class="product-row">
            <span class="product-name">(2) 布丁芋心</span>
            <div class="quantity-box">
              <button type="button" class="quantity-button minus-button" aria-label="減少布丁芋心數量">−</button>
              <input type="text" class="quantity-input" value="0" readonly aria-label="布丁芋心數量" data-name="(2) 布丁芋心" data-price="150">
              <button type="button" class="quantity-button plus-button" aria-label="增加布丁芋心數量">+</button>
            </div>
          </div>
        </div>
      </section>

      <section class="summary" aria-label="訂單總表摘要">
        <h2 class="summary-title">📋 訂單總表摘要</h2>
        <div class="summary-row">
          <span>總數量</span>
          <strong><span id="total-quantity">0</span> 份</strong>
        </div>
        <div class="summary-row total">
          <span>總金額</span>
          <strong>$<span id="total-price">0</span> 元</strong>
        </div>
      </section>

      <section class="customer-info" aria-labelledby="customer-info-title">
        <h2 class="section-title" id="customer-info-title">📦 個人資料</h2>
        <div class="form-field">
          <label for="customer-name">收件姓名 <span class="required">*</span></label>
          <input id="customer-name" type="text" autocomplete="name" placeholder="請輸入姓名">
        </div>
        <div class="form-field">
          <label for="customer-phone">電話 <span class="required">*</span></label>
          <input id="customer-phone" type="tel" autocomplete="tel" placeholder="請輸入電話">
        </div>
        <div class="form-field">
          <label for="customer-address">到府服務地址 <span class="required">*</span></label>
          <textarea id="customer-address" autocomplete="street-address" placeholder="請輸入地址"></textarea>
        </div>
        <div class="form-field">
          <label for="store-711">7-11（寄冰）</label>
          <input id="store-711" type="text" placeholder="有需要請輸入門市，沒有可留白">
        </div>
        <div class="form-field">
          <label for="store-family">全家（寄冰）</label>
          <input id="store-family" type="text" placeholder="有需要請輸入門市，沒有可留白">
        </div>
        <div class="form-field">
          <label for="order-note">沒有加購的資料／其他備註</label>
          <textarea id="order-note" placeholder="沒有備註可留白"></textarea>
        </div>
      </section>

      <div class="button-area">
        <button id="copy-button" type="button" class="action-button copy-button">📋 一鍵複製訂單</button>
        <button id="line-button" type="button" class="action-button line-button">📱 傳送到官方 LINE</button>
      </div>
      <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
      <p class="hint">傳送到 LINE 前會先複製訂單，開啟 LINE 後請貼上內容。</p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const quantityInputs = Array.from(document.querySelectorAll(".quantity-input"));
      const minusButtons = Array.from(document.querySelectorAll(".minus-button"));
      const plusButtons = Array.from(document.querySelectorAll(".plus-button"));
      const totalQuantityElement = document.getElementById("total-quantity");
      const totalPriceElement = document.getElementById("total-price");
      const copyButton = document.getElementById("copy-button");
      const lineButton = document.getElementById("line-button");
      const statusMessage = document.getElementById("status-message");
      const lineUrl = "https://lin.ee/n5vNZRz";

      function updateSummary() {
        let totalQuantity = 0;
        let totalPrice = 0;

        quantityInputs.forEach(function (input) {
          const quantity = Number(input.value) || 0;
          const price = Number(input.dataset.price) || 0;
          totalQuantity += quantity;
          totalPrice += quantity * price;
        });

        totalQuantityElement.textContent = totalQuantity;
        totalPriceElement.textContent = totalPrice;
      }

      function showStatus(message, isError) {
        statusMessage.textContent = message;
        statusMessage.classList.toggle("error", Boolean(isError));
        window.clearTimeout(showStatus.timer);
        showStatus.timer = window.setTimeout(function () {
          statusMessage.textContent = "";
          statusMessage.classList.remove("error");
        }, 3000);
      }

      function buildOrderText() {
        const name = document.getElementById("customer-name").value.trim();
        const phone = document.getElementById("customer-phone").value.trim();
        const address = document.getElementById("customer-address").value.trim();

        if (!name) {
          return { success: false, message: "⚠️ 請填寫收件姓名" };
        }
        if (!phone) {
          return { success: false, message: "⚠️ 請填寫電話" };
        }
        if (!address) {
          return { success: false, message: "⚠️ 請填寫到府服務地址" };
        }

        const lines = ["🍡 老爹涼糕點單表", ""];
        quantityInputs.forEach(function (input) {
          const quantity = Number(input.value) || 0;
          if (quantity > 0) {
            lines.push(`${input.dataset.name}（${input.dataset.price} 元）× ${quantity}`);
          }
        });

        lines.push(
          "",
          "📋 訂單總表摘要",
          `總數量：${totalQuantityElement.textContent} 份`,
          `總金額：$${totalPriceElement.textContent} 元`,
          "",
          "📦 個人資料",
          `收件姓名：${name}`,
          `電話：${phone}`,
          `到府服務地址：${address}`
        );

        const optionalFields = [
          ["7-11（寄冰）", document.getElementById("store-711").value.trim()],
          ["全家（寄冰）", document.getElementById("store-family").value.trim()],
          ["沒有加購的資料／其他備註", document.getElementById("order-note").value.trim()]
        ];

        optionalFields.forEach(function ([label, value]) {
          if (value) {
            lines.push(`${label}：${value}`);
          }
        });

        return { success: true, text: lines.join("\n") };
      }

      async function copyText(text) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          try {
            await navigator.clipboard.writeText(text);
            return;
          } catch (error) {
            // Use the legacy copy method when clipboard permissions are unavailable.
          }
        }

        const temporaryTextarea = document.createElement("textarea");
        temporaryTextarea.value = text;
        temporaryTextarea.style.position = "fixed";
        temporaryTextarea.style.left = "-9999px";
        document.body.appendChild(temporaryTextarea);
        temporaryTextarea.focus();
        temporaryTextarea.select();
        const copied = document.execCommand("copy");
        document.body.removeChild(temporaryTextarea);

        if (!copied) {
          throw new Error("複製失敗");
        }
      }

      async function copyOrder(order) {
        order = order || buildOrderText();
        if (!order.success) {
          showStatus(order.message, true);
          return false;
        }

        try {
          await copyText(order.text);
          showStatus("✅ 訂單已複製到剪貼簿", false);
          return true;
        } catch (error) {
          showStatus("⚠️ 複製失敗，請重新操作", true);
          return false;
        }
      }

      minusButtons.forEach(function (button, index) {
        button.addEventListener("click", function () {
          const current = Number(quantityInputs[index].value) || 0;
          quantityInputs[index].value = Math.max(0, current - 1);
          updateSummary();
        });
      });

      plusButtons.forEach(function (button, index) {
        button.addEventListener("click", function () {
          const current = Number(quantityInputs[index].value) || 0;
          quantityInputs[index].value = current + 1;
          updateSummary();
        });
      });

      copyButton.addEventListener("click", function () {
        copyOrder();
      });
      lineButton.addEventListener("click", async function () {
        const order = buildOrderText();
        if (!order.success) {
          showStatus(order.message, true);
          return;
        }

        const lineWindow = window.open("about:blank", "_blank");
        const copied = await copyOrder(order);
        if (!copied) {
          if (lineWindow) {
            lineWindow.close();
          }
          return;
        }

        if (lineWindow) {
          lineWindow.opener = null;
          lineWindow.location.href = lineUrl;
        } else {
          window.location.href = lineUrl;
        }
      });

      updateSummary();
    });
  </script>
</body>
</html>
